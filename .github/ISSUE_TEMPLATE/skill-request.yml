name: Missing skill or capability
description: There is an outcome an agent cannot reach with the current skills.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Skills describe **how an agent should accomplish an outcome**. Please frame this as an
        outcome rather than a feature — "the agent can't build a post-purchase replenishment
        sequence for consumables" rather than "add a replenishment field".

  - type: dropdown
    id: plugin
    attributes:
      label: Which product
      options:
        - "targetbay-email-sms — email and SMS"
        - "targetbay-reviews — reviews and UGC"
        - "targetbay-loyalty — loyalty and referrals"
        - "targetbay-onboarding — onboarding and onsite"
        - "Spans several, or none of them"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: The outcome the agent cannot reach today
      description: What should a store owner be able to ask for, and what should the agent produce?
    validations:
      required: true

  - type: input
    id: closest
    attributes:
      label: Closest existing skill
      description: The directory under that plugin's `skills/` that comes nearest, and why it falls short. `none` is a valid answer.
      placeholder: customer-lifecycle
    validations:
      required: true

  - type: dropdown
    id: capability
    attributes:
      label: Does this need a new capability?
      description: A capability is something the product's MCP must be able to do. See that plugin's `capabilities.yaml`.
      options:
        - "No — it composes existing capabilities"
        - "Yes — it needs something the platform cannot do yet"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Prior art, a rough outline, or the shape of the output you'd expect.
    validations:
      required: false
