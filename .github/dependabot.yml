version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: "/tests"
    schedule:
      interval: weekly
    groups:
      test-deps:
        patterns: ["*"]
    commit-message:
      prefix: chore
