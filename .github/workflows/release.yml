name: release

# Plugins release independently, tagged <plugin>@<version> — for example
# `targetbay-email-sms@2.1.0`. The tag names which directory is published.
on:
  push:
    tags: ["*@*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve plugin and version from the tag
        id: tag
        run: |
          plugin="${GITHUB_REF_NAME%@*}"
          version="${GITHUB_REF_NAME##*@}"
          [ -d "plugins/$plugin" ] || { echo "no such plugin: plugins/$plugin"; exit 1; }
          declared=$(cat "plugins/$plugin/VERSION")
          [ "$version" = "$declared" ] || { echo "tag says $version, plugins/$plugin/VERSION says $declared"; exit 1; }
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate the whole repository before publishing
        # The whole repository, not only the released plugin: the relative-link sweep and the
        # marketplace consistency checks are cross-plugin, and a release must not ship while
        # another plugin's manifest disagrees with the marketplace.
        run: |
          pip install -r tests/requirements.txt
          python tests/validate.py
          python tests/evals/run_evals.py
          for d in plugins/*/skills/*/; do agentskills validate "$d" || exit 1; done

      - name: Build tarball
        working-directory: plugins/${{ steps.tag.outputs.plugin }}
        run: npm pack

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "plugins/${{ steps.tag.outputs.plugin }}"/*.tgz \
            --title "${{ steps.tag.outputs.plugin }} ${{ steps.tag.outputs.version }}" \
            --generate-notes

      - name: Publish to npmjs
        working-directory: plugins/${{ steps.tag.outputs.plugin }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Publish to GitHub Packages
        # Note: GitHub Packages requires a token even to READ a public package,
        # so READMEs point customers at npmjs. This is a secondary mirror.
        working-directory: plugins/${{ steps.tag.outputs.plugin }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --access public --registry=https://npm.pkg.github.com
