name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r tests/requirements.txt

      - name: Package contracts
        run: python tests/validate.py

      - name: Golden prompts
        run: python tests/evals/run_evals.py

      - name: Agent Skills specification
        # Independent of tests/validate.py's in-process `spec` group: this runs the
        # reference CLI, so a drift between the two surfaces here rather than silently.
        run: |
          fail=0
          for d in plugins/*/skills/*/; do
            agentskills validate "$d" || fail=1
          done
          exit $fail

      - name: Manifests parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          for p in plugins/*/; do
            node -e "JSON.parse(require('fs').readFileSync('$p/.claude-plugin/plugin.json'))"
            node -e "JSON.parse(require('fs').readFileSync('$p/package.json'))"
            node --check "$p/scripts/install.mjs"
            sh -n "$p/scripts/install.sh"
          done

      - name: Versions agree
        # tests/validate.py asserts this too; keeping it here means a version mismatch is
        # named in its own step rather than buried in a 2000-check summary.
        run: |
          for p in plugins/*/; do
            name=$(basename "$p")
            version=$(cat "$p/VERSION")
            for f in package.json .claude-plugin/plugin.json; do
              declared=$(node -p "require('./$p/$f').version")
              [ "$declared" = "$version" ] || { echo "$p$f is $declared, VERSION is $version"; exit 1; }
            done
            listed=$(node -p "
              const m = require('./.claude-plugin/marketplace.json');
              const e = m.plugins.find(p => p.name === '$name');
              e ? e.version : 'MISSING';
            ")
            [ "$listed" = "$version" ] || { echo "marketplace lists $name at $listed, VERSION is $version"; exit 1; }
            echo "$name at $version"
          done

      - name: Installers work
        run: |
          for p in plugins/*/; do
            name=$(basename "$p")
            dest="$RUNNER_TEMP/skills-$name"
            node "$p/scripts/install.mjs" --dest "$dest"
            expected=$(find "$p/skills" -maxdepth 1 -mindepth 1 -type d | wc -l)
            actual=$(find "$dest" -maxdepth 1 -mindepth 1 -type d | wc -l)
            [ "$actual" -eq "$expected" ] || { echo "$name: installed $actual skills, expected $expected"; exit 1; }
            echo "$name: $actual skills installed"
          done
