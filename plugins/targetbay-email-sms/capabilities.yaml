# TargetBay Email & SMS Marketing Skills — Capability Registry
#
# Single source of truth for the abstract capability identifiers that skills declare
# in their `requires:` frontmatter.
#
# These are CAPABILITY names, not tool names. This package deliberately does not know
# the TargetBay Email & SMS MCP tool signatures. Every `mcp_tools` value is TODO until the real
# TargetBay Email & SMS MCP surface is inspected and mapped. See docs/mcp-integration.md.
#
# Never add a capability here to justify a skill. Add it only when the underlying
# TargetBay Email & SMS platform genuinely exposes that class of data or action.

version: 1.3.0

# access values:
#   read   - retrieves data, no state change
#   write  - creates or modifies platform state
#   send   - dispatches messages to real people (always HIGH_IMPACT)
access_levels: [read, write, send]

capabilities:
  - id: email_sms.store_profile
    description: >-
      Store identity, vertical, currency, locale, catalogue size, sending history, plan limits.
      Also carries the derived Store Context Pack once the store has been onboarded — see
      https://github.com/targetbay360/targetbay-agent-skills/blob/main/plugins/targetbay-onboarding/schemas/context-pack.schema.json
    access: read
    mcp_tools: TODO

  - id: email_sms.customer_intelligence
    description: Customer profiles, lifecycle stage, RFM, AOV, LTV, engagement history, churn and purchase propensity signals.
    access: read
    mcp_tools: TODO

  - id: email_sms.product_intelligence
    description: Products, categories, attributes, price bands, margin signals, inventory posture, affinity and co-purchase relationships.
    access: read
    mcp_tools: TODO

  - id: email_sms.order_intelligence
    description: Orders, order items, purchase frequency, repeat intervals, discount usage, revenue attribution.
    access: read
    mcp_tools: TODO

  - id: email_sms.segmentation
    description: Existing segments and lists, their definitions and sizes; creation and modification of segments.
    access: write
    mcp_tools: TODO

  - id: email_sms.campaign_management
    description: Existing campaigns, their configuration, drafts; creation, modification and scheduling of campaigns.
    access: write
    mcp_tools: TODO

  - id: email_sms.campaign_analytics
    description: Campaign performance — revenue, conversion, AOV, engagement, unsubscribe and complaint rates, per-variant results.
    access: read
    mcp_tools: TODO

  - id: email_sms.automation
    description: Existing automations, their topology, triggers, timing and channels; creation and modification of automations.
    access: write
    mcp_tools: TODO

  - id: email_sms.automation_analytics
    description: Automation performance — entry and completion rates, per-node drop-off, revenue per entrant, goal attainment.
    access: read
    mcp_tools: TODO

  - id: email_sms.template_management
    description: Email and SMS templates and content blocks; creation and modification of templates.
    access: write
    mcp_tools: TODO

  - id: email_sms.messaging_email
    description: Dispatch of email to real recipients — sending or activating a scheduled send.
    access: send
    mcp_tools: TODO

  - id: email_sms.messaging_sms
    description: Dispatch of SMS to real recipients — sending or activating a scheduled send.
    access: send
    mcp_tools: TODO
    notes: >-
      UNVERIFIED. No local TargetBay Email & SMS implementation of SMS dispatch has been inspected.
      Skills must confirm this capability is present before planning SMS execution and
      degrade to email-only when it is absent. See docs/mcp-integration.md.

  - id: email_sms.sending_infrastructure
    description: >-
      Sending domains and subdomains, authentication record state (SPF, DKIM, DMARC, BIMI) and
      whether it aligns with the visible sender, dedicated versus shared IP, warm-up state and the
      current sending limits that bound it.
    access: read
    mcp_tools: TODO
    notes: >-
      UNVERIFIED. Every sending platform must hold this configuration for mail to leave at all, but
      whether the TargetBay MCP exposes it as readable data has never been inspected from this
      repository. Skills requiring it must report `partial` and reason from
      email_sms.campaign_analytics proxies when it is absent, and must never present an
      authentication state they could not read. See docs/mcp-integration.md.

  - id: email_sms.suppression_and_consent
    description: Suppression lists, consent state per channel, quiet-hours and frequency-cap configuration.
    access: read
    mcp_tools: TODO

  - id: email_sms.marketing_calendar
    description: Scheduled and in-flight campaigns and automations across a date range; calendar occupancy and collisions.
    access: read
    mcp_tools: TODO

  - id: email_sms.experimentation
    description: A/B and multivariate test configuration and results, including winner selection state.
    access: write
    mcp_tools: TODO

  - id: email_sms.event_stream
    description: >-
      The platform's own stream of contact, list, campaign and order events, and the ability to
      subscribe to it. Individual events as they occur, distinct from the aggregated results in
      email_sms.campaign_analytics.
    access: read
    mcp_tools: TODO
    notes: >-
      Evidenced by an platform surface exposing a signed event subscription covering
      contact, list, campaign and order activity. See docs/mcp-integration.md. Whether the MCP
      surfaces this stream at all is an open question: a request/response tool surface and a push
      subscription are different shapes. Skills requiring it must degrade to aggregate analytics
      when it is absent.

  - id: email_sms.event_tracking
    description: >-
      Recording a behavioural or commercial event against a contact from outside the platform —
      the write side of the event stream.
    access: write
    mcp_tools: TODO
    notes: >-
      Evidenced by the same surface, which exposes an event-tracking operation.
      Unconfirmed: whether event names are free-form or an enumerated set, and whether a recorded
      event can trigger a platform-side automation. If it cannot, every journey that depends on a
      store-pushed trigger needs an external orchestrator. See docs/mcp-integration.md.
