# TargetBay Onboarding Skills — Capability Registry
#
# Single source of truth for the abstract capability identifiers that skills declare
# in their `requires:` frontmatter.
#
# These are CAPABILITY names, not tool names. This plugin does not re-declare the
# product capabilities that live in the three product registries. It declares what
# onboarding needs that no single product owns: a derived view of the whole store, the
# answers the platform cannot observe, a cross-product apply path, activation — and the
# onsite reads and writes that the first step of onboarding depends on, which belong to
# no product because onsite capture is not one.
#
# Every `mcp_tools` value is TODO until the real TargetBay MCP surface is inspected and
# mapped. See docs/mcp-integration.md.

version: 0.2.0

# access values:
#   read   - retrieves data, no state change
#   write  - creates or modifies platform state
#   send   - dispatches messages to real people (always HIGH_IMPACT)
access_levels: [read, write, send]

capabilities:
  - id: onboarding.store_context
    description: >-
      The derived Store Context Pack — identity, detected vertical, catalogue shape, customer shape,
      brand profile, currency and locale, traffic volume, plan limits, existing coverage across all
      three products, and the per-capability data-readiness matrix. Every value carries its basis,
      sample size and evidence.
    access: read
    mcp_tools: TODO
    notes: >-
      The pack is derived, not stored. Derivation belongs on the platform side: computing a lapse point
      means reading a full inter-purchase-interval distribution, and a skill that never sees the raw
      distribution cannot invent a threshold from it. Where the platform exposes only raw reads, the
      affected values are absent rather than estimated (global-rules.md#G3).

  - id: onboarding.intake
    description: >-
      Structured answers to what the platform cannot observe — objectives, margin posture, capacity,
      brand policy, channel and market restrictions, and real seasonality. Read and write.
    access: write
    mcp_tools: TODO
    notes: >-
      Stored on the store record rather than in the session, because the answers must outlive a single
      agent run and must be readable by every product's skills through their own store_profile
      capability.

  - id: onboarding.provisioning
    description: >-
      Dry-run and application of a cross-product configuration plan — segments, journeys, templates,
      review triggers, loyalty configuration and onsite placements — and verification of what was
      created against what was approved.
    access: write
    mcp_tools: TODO
    notes: >-
      UNVERIFIED. No TargetBay write surface has been inspected. Skills must confirm this capability is
      present before planning execution, and degrade to a plan plus a build checklist when it is absent.
      Creation and activation must be separate operations; see safety-rules.md#S2.

  - id: onboarding.activation
    description: >-
      Activation of provisioned resources that can reach a real person — switching a journey, review
      trigger or onsite offer from draft to live.
    access: send
    mcp_tools: TODO
    notes: >-
      Separate from onboarding.provisioning on purpose. A single capability covering both would make the
      approval gate in safety-rules.md#S5 a request rather than an enforcement.

  # ---------------------------------------------------------------- onsite capture
  #
  # Onsite capture and personalisation is the first step of onboarding, not a product.
  # It spends no contact budget (contact-ownership-rules.md#X3), so it can run while
  # everything else is still being decided, and what it captures cannot be captured
  # retroactively (sequencing-rules.md#SQ1). The capabilities below are what that step
  # reads and writes.

  - id: onboarding.consent_and_tracking
    description: Consent state for tracking and onsite personalisation, regional consent mode, and what may be collected or acted on for a given visitor.
    access: read
    mcp_tools: TODO
    notes: >-
      Onsite capture acts on behaviour, so consent is a precondition rather than a detail. Skills must
      confirm this capability before planning anything that depends on identifying or profiling a
      visitor, and degrade to non-personalised defaults when it is absent or withheld
      (safety-rules.md#S15).

  - id: onboarding.visitor_intelligence
    description: Session and visitor behaviour — entry source, pages viewed, dwell, cart state, return frequency, and whether the visitor is identified.
    access: read
    mcp_tools: TODO

  - id: onboarding.product_intelligence
    description: Products, categories, attributes, price bands, margin signals, inventory posture and co-view or co-purchase affinity.
    access: read
    mcp_tools: TODO

  - id: onboarding.audience_definition
    description: Onsite audience and segment definitions, their sizes and their creation or modification.
    access: write
    mcp_tools: TODO

  - id: onboarding.recommendation_placement
    description: Recommendation widgets — which surface they sit on, which strategy drives them, what they exclude — and their configuration.
    access: write
    mcp_tools: TODO

  - id: onboarding.recommendation_analytics
    description: Per-placement performance — impression, click, add-to-cart, attributed revenue and cannibalisation signals.
    access: read
    mcp_tools: TODO

  - id: onboarding.offers
    description: Onsite offers, popups, banners and bars — targeting, trigger, frequency, content and their creation or modification.
    access: write
    mcp_tools: TODO

  - id: onboarding.offer_analytics
    description: Per-offer performance — impressions, engagement, dismissal, conversion and the revenue attributable to it.
    access: read
    mcp_tools: TODO

  - id: onboarding.onsite_search
    description: Onsite search queries, result counts, click-through and conversion; synonym, redirect and ranking configuration.
    access: write
    mcp_tools: TODO

  - id: onboarding.experimentation
    description: Onsite A/B and multivariate test configuration, traffic allocation, results and winner state.
    access: write
    mcp_tools: TODO

  - id: onboarding.experience_analytics
    description: Page and funnel performance — entry, exit, conversion rate and revenue per session, by surface and audience.
    access: read
    mcp_tools: TODO
