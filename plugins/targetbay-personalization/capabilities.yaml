# TargetBay Personalization Skills — Capability Registry
#
# Single source of truth for the abstract capability identifiers that skills declare
# in their `requires:` frontmatter.
#
# These are CAPABILITY names, not tool names. This package deliberately does not know
# the TargetBay Personalization MCP tool signatures. Every `mcp_tools` value is TODO
# until the real MCP surface is inspected and mapped. See docs/mcp-integration.md.
#
# Never add a capability here to justify a skill. Add it only when the underlying
# TargetBay Personalization platform genuinely exposes that class of data or action.

version: 1.1.0

# access values:
#   read   - retrieves data, no state change
#   write  - creates or modifies platform state
#   send   - dispatches messages to real people (always HIGH_IMPACT)
access_levels: [read, write, send]

capabilities:
  - id: onsite.store_profile
    description: >-
      Store identity, vertical, currency, locale, catalogue size, traffic volume and plan limits.
      Also carries the derived Store Context Pack once the store has been onboarded — see
      https://github.com/targetbay360/targetbay-agent-skills/blob/main/plugins/targetbay-onboarding/schemas/context-pack.schema.json
    access: read
    mcp_tools: TODO

  - id: onsite.visitor_intelligence
    description: Session and visitor behaviour — entry source, pages viewed, dwell, cart state, return frequency, and whether the visitor is identified.
    access: read
    mcp_tools: TODO

  - id: onsite.audience_definition
    description: Onsite audience and segment definitions, their sizes and their creation or modification.
    access: write
    mcp_tools: TODO

  - id: onsite.recommendation_placement
    description: Recommendation widgets — which surface they sit on, which strategy drives them, what they exclude — and their configuration.
    access: write
    mcp_tools: TODO

  - id: onsite.recommendation_analytics
    description: Per-placement performance — impression, click, add-to-cart, attributed revenue and cannibalisation signals.
    access: read
    mcp_tools: TODO

  - id: onsite.offers
    description: Onsite offers, popups, banners and bars — targeting, trigger, frequency, content and their creation or modification.
    access: write
    mcp_tools: TODO

  - id: onsite.offer_analytics
    description: Per-offer performance — impressions, engagement, dismissal, conversion and the revenue attributable to it.
    access: read
    mcp_tools: TODO

  - id: onsite.search
    description: Onsite search queries, result counts, click-through and conversion; synonym, redirect and ranking configuration.
    access: write
    mcp_tools: TODO

  - id: onsite.product_intelligence
    description: Products, categories, attributes, price bands, margin signals, inventory posture and co-view or co-purchase affinity.
    access: read
    mcp_tools: TODO

  - id: onsite.experimentation
    description: Onsite A/B and multivariate test configuration, traffic allocation, results and winner state.
    access: write
    mcp_tools: TODO

  - id: onsite.experience_analytics
    description: Page and funnel performance — entry, exit, conversion rate and revenue per session, by surface and audience.
    access: read
    mcp_tools: TODO

  - id: onsite.consent_and_tracking
    description: Consent state for tracking and personalization, regional consent mode, and what may be collected or acted on for a given visitor.
    access: read
    mcp_tools: TODO
    notes: >-
      Personalization acts on behaviour, so consent is a precondition rather than a
      detail. Skills must confirm this capability before planning anything that depends
      on identifying or profiling a visitor, and degrade to non-personalised defaults
      when it is absent or withheld.
