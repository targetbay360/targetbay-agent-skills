suite: automation
description: Automation portfolio, topology and tuning — the three levels and the boundaries between them.

cases:
  - id: auto-001
    prompt: What automations do we need?
    expect_skill: automation-strategy
    expect_composes: [automation-architect, audience-discovery]
    must_cite:
      - global-rules.md#G6
      - automation-rules.md#R6
    must_not:
      - Recommend a journey without sizing its audience
      - Add a new journey where an existing one already triggers on the same event
    notes: >-
      Portfolio level. automation-architect would design one journey rather than deciding which
      journeys should exist.

  - id: auto-002
    prompt: Improve our post-purchase marketing.
    expect_skill: automation-strategy
    expect_composes: [automation-architect, audience-discovery]
    must_cite:
      - automation-rules.md#R1
      - automation-rules.md#R4
      - automation-rules.md#R5
    must_not:
      - Assume one objective means one automation
      - Build every technically possible variant
      - Use a uniform node count across variants
    notes: >-
      Either automation-strategy or automation-architect is defensible here. Strategy is preferred
      because "improve" implies the current shape is in question.
    accept_skills: [automation-strategy, automation-architect]

  - id: auto-003
    prompt: Design a welcome journey for first-time buyers.
    expect_skill: automation-architect
    expect_composes: [audience-discovery]
    must_cite:
      - automation-rules.md#R8
      - automation-rules.md#R15
    must_not:
      - Produce a fixed-length sequence
      - Include a node that cannot state why it exists
      - Omit the goal or the exit criteria
    notes: >-
      The objective is agreed and a topology is wanted.

  - id: auto-004
    prompt: Should we split our abandoned cart automation by order value?
    expect_skill: automation-architect
    must_cite:
      - automation-rules.md#R4
      - automation-rules.md#R11
    must_not:
      - Recommend the split without sizing the resulting audiences
      - Recommend the split when both branches would receive the same treatment
    notes: >-
      A variant question. The correct answer may well be no.

  - id: auto-005
    prompt: Our welcome series isn't converting.
    expect_skill: automation-optimization
    expect_composes: [ab-testing]
    must_cite:
      - automation-rules.md#R18
      - safety-rules.md#S5
    must_not:
      - Add a node at the end of a journey people already abandoned
      - Blame content before checking the entry audience
      - Change a live journey without stating the effect on in-flight contacts
    notes: >-
      Tuning, not redesign. The largest per-node loss is the target.

  - id: auto-006
    prompt: Abandoned cart revenue is down since March.
    expect_skill: automation-optimization
    must_cite:
      - automation-rules.md#R18
    must_not:
      - Conclude the strategy is wrong before checking for expired offers and dead links
    notes: >-
      Decay is the most common cause of a journey that used to work.

  - id: auto-007
    prompt: Half of this journey needs data we keep in our own system — where should each step actually run?
    expect_skill: automation-orchestration
    expect_composes: [automation-architect]
    must_cite:
      - global-rules.md#G10
      - frequency-rules.md#F3
    must_not:
      - Move a send outside the platform without naming the layer that enforces suppression and frequency
      - Propose an orchestrator-side copy of suppression or consent state
      - Move the whole journey out when only one step needs the external data
      - Name a specific external workflow product
    notes: >-
      Placement, not journey shape. automation-architect decides what the journey looks like once
      each step's home is settled.

  - id: auto-008
    prompt: Which of your ready-made recipes should we set up first?
    expect_skill: automation-recipe-selector
    expect_composes: [automation-strategy, audience-discovery]
    must_cite:
      - global-rules.md#G6
      - automation-rules.md#R4
    must_not:
      - Rank a recipe ahead of the prerequisite work that unblocks it
      - Recommend a recipe that duplicates a journey the store already runs
      - Present a playbook position as a data-driven conclusion
      - List several prerequisites for a blocked recipe instead of naming the one that blocks it
    notes: >-
      Ranking a finite published library by readiness. automation-strategy would derive the
      portfolio from store data with no catalogue in hand.

  - id: auto-009
    prompt: We don't want a template — design the journeys our data says we need.
    expect_skill: automation-strategy
    expect_composes: [automation-architect, audience-discovery]
    must_cite:
      - automation-rules.md#R1
    must_not:
      - Offer a recipe from the library as the answer
      - Assume one objective means one automation
    notes: >-
      The boundary assertion. This fails loudly if automation-recipe-selector's description
      over-reaches into automation-strategy's territory.
    accept_skills: [automation-strategy, automation-recipe-selector]
