suite: optimization
description: Campaign diagnosis, content, channel mix, testing and targeting.

cases:
  - id: opt-001
    prompt: This campaign underperformed — fix the subject line.
    expect_skill: campaign-optimization
    expect_composes: [audience-discovery, ab-testing, content-optimization]
    must_cite:
      - global-rules.md#G1
    must_not:
      - Rewrite the subject line before walking the funnel
      - Accept the user's diagnosis without checking it against the evidence
      - Optimise on open rate alone
    notes: >-
      The user has named a fix, not a problem. The skill must check whether the named fix
      addresses the actual failure point, and say so when it does not.

  - id: opt-002
    prompt: Our weekly newsletter engagement keeps declining.
    expect_skill: campaign-optimization
    must_cite:
      - frequency-rules.md#F11
    must_not:
      - Recommend a content rewrite before checking cadence
      - Ignore the unsubscribe trend alongside the engagement trend
    notes: >-
      Rising opt-outs at stable content quality is a frequency finding, not a copy finding.

  - id: opt-003
    prompt: This copy reads badly and the offer confused people.
    expect_skill: content-optimization
    expect_composes: [ab-testing]
    must_cite:
      - content-rules.md#N7
      - content-rules.md#N8
    must_not:
      - Produce finished creative rather than content direction
      - Leave a claim in the direction that the store cannot support
      - Omit the empty state for a personalised element
    notes: >-
      The failure point is already known to be the message itself.

  - id: opt-004
    prompt: We're adding SMS — what should we send on it?
    expect_skill: channel-optimization
    expect_composes: [audience-discovery]
    must_cite:
      - audience-rules.md#A10
      - frequency-rules.md#F7
    must_not:
      - Assume email consent covers SMS
      - Duplicate email content onto SMS at the same moment
      - Plan SMS without confirming the capability is available
    notes: >-
      The most common SMS mistake is treating it as a second copy of the email programme.

  - id: opt-005
    prompt: Our SMS costs are up but revenue isn't.
    expect_skill: channel-optimization
    must_cite:
      - frequency-rules.md#F7
    must_not:
      - Recommend cuts without stating the reach being given up
    notes: >-
      Cost against value per message, and an explicit statement of what is lost.

  - id: opt-006
    prompt: Set up an A/B test on these two subject lines.
    expect_skill: ab-testing
    expect_composes: [audience-discovery]
    must_cite:
      - campaign-rules.md#C10
    must_not:
      - Run the test without checking the audience can resolve a difference worth acting on
      - Set the decision threshold after seeing results
      - Use opens as the success metric
      - Omit the unsubscribe guard metric
    notes: >-
      Reporting that the test is not resolvable at this volume is a correct and common outcome.

  - id: opt-007
    prompt: Variant B won, let's roll it out.
    expect_skill: ab-testing
    must_cite:
      - campaign-rules.md#C10
    must_not:
      - Declare a winner without checking the outcome metric and the guard metric
      - Read the result against a threshold moved after the run
    notes: >-
      A variant that wins on clicks and loses on revenue selected the wrong winner.

  - id: opt-008
    prompt: Who should we target for this campaign?
    expect_skill: audience-discovery
    must_cite:
      - audience-rules.md#A1
      - audience-rules.md#A4
      - audience-rules.md#A11
    must_not:
      - Return an audience that has not been resolved and sized
      - Return an unordered list of audiences
      - Omit exclusions from an audience definition
    notes: >-
      Returning one audience is frequently the correct answer.

  - id: opt-009
    prompt: Should we split our win-back list into separate segments?
    expect_skill: audience-discovery
    must_cite:
      - audience-rules.md#A3
      - audience-rules.md#A2
    must_not:
      - Recommend a split where both groups would receive identical treatment
      - Recommend a split producing groups too small to read a result from
    notes: >-
      A segmentation question. The test is whether treatment actually differs.

  - id: opt-011
    prompt: Can we have it write the weekly newsletter for us?
    expect_skill: ai-content-governance
    expect_composes: [content-optimization]
    must_cite:
      - content-rules.md#N3
      - global-rules.md#G3
    must_not:
      - Set one gate for the whole newsletter rather than classifying what each part asserts
      - Let generated wording assert a price or stock position it was not given as verified data
      - Propose a review load larger than the store's stated reviewer capacity
    notes: >-
      Governance, not copywriting. content-optimization would rewrite a message that underperforms;
      this decides who signs it off before it is sent at all.

  - id: opt-010
    prompt: When is the best time of day to send our emails?
    expect_skill: send-time-optimization
    expect_composes: [ab-testing]
    must_cite:
      - campaign-rules.md#C6
      - frequency-rules.md#F9
    must_not:
      - Recommend a send hour taken from a published industry figure
      - Recommend per-contact timing without checking engagement events per person
      - Report an uplift without the variance it has to clear
      - Ignore local time zones or quiet hours
    notes: >-
      The most common correct answer is "your volume cannot resolve this — keep the current time".
      That is a result, not a failure to answer.

  - id: opt-012
    prompt: Can we safely send this campaign? Check it before it goes out.
    expect_skill: email-quality-auditor
    expect_composes: [deliverability-qa, email-render-qa, dynamic-content-personalizer, audience-discovery]
    must_cite:
      - safety-rules.md#S4
      - frequency-rules.md#F2
      - content-rules.md#N9
    must_not:
      - Return a verdict without stating the resolved audience size first
      - Escalate a fixable defect to BLOCK
      - Report an unchecked dimension as passed
      - Count only this campaign's messages when judging frequency
    notes: >-
      The pre-send gate. Every dimension is individually owned elsewhere; what this case asserts is
      that the sweep counts total contact rather than this send alone, and that the blast radius
      precedes the verdict.

  - id: opt-013
    prompt: Our engagement has been sliding across everything we send — are we authenticated properly?
    expect_skill: deliverability-qa
    expect_composes: [list-hygiene]
    must_cite:
      - deliverability-rules.md#D1
      - deliverability-rules.md#D7
      - global-rules.md#G2
    must_not:
      - Recommend a content or subject-line change while the identity layer is unverified
      - Assert inbox placement from delivery, open or click data
      - Compare a rate against a published industry benchmark
      - Report an authentication record as fixed when it lives in the store's DNS
    notes: >-
      Layer order is the whole discipline. A programme-wide slide is diagnosed at identity before
      reputation and at reputation before content, and placement itself is never observable here.

  - id: opt-014
    prompt: Will this email break in dark mode or with images off?
    expect_skill: email-render-qa
    must_cite:
      - content-rules.md#N8
      - content-rules.md#N9
      - personalization-rules.md#P12
    must_not:
      - Report a view as passing when it could not be inspected
      - Treat a missing or broken opt-out as a rendering defect rather than a stop
      - Weight defects by a published client distribution rather than this store's own
      - Apply a fix to the template rather than recommending one
    notes: >-
      A fashion retailer whose hero is a single image. The images-off view is the harshest and the
      cheapest to fail, and an unchecked view is never reported as a passing one.

  - id: opt-015
    prompt: How should we personalize this email beyond just the first name?
    expect_skill: dynamic-content-personalizer
    expect_composes: [product-recommendation-strategy, audience-discovery]
    must_cite:
      - personalization-rules.md#P1
      - personalization-rules.md#P2
      - personalization-rules.md#P3
    must_not:
      - Propose an element resting on a field the platform does not hold for that contact
      - Leave any element without a defined fallback and empty case
      - Keep an element whose fallback branch serves most recipients
      - Select the products itself rather than delegating the choice
    notes: >-
      A beauty store with partial profile data. The load-bearing decision is dropping an element
      whose fallback would serve most of the list — at that point the fallback is the message.

  - id: opt-016
    prompt: Engagement has collapsed at one email provider but holds steady everywhere else.
    expect_skill: deliverability-qa
    expect_composes: [list-hygiene]
    must_cite:
      - deliverability-rules.md#D6
      - deliverability-rules.md#D8
    must_not:
      - Draw a programme-wide conclusion from one provider's numbers
      - Recommend suppression as the remedy before the layer is identified
      - Report the drop as confirmed spam placement
    notes: >-
      An electronics store. One provider turning is a different problem from a programme-wide
      decline and has a different owner; suppression does not reach a layer it cannot touch.

  - id: opt-017
    prompt: Review our welcome automation before we switch it on.
    expect_skill: email-quality-auditor
    must_cite:
      - safety-rules.md#S2
      - personalization-rules.md#P12
      - global-rules.md#G3
    must_not:
      - Apply the same bar to an unattended journey as to a one-off send
      - Pass a node referencing a product the store no longer sells
      - Treat a missing greeting fallback as cosmetic when it repeats for every future entrant
    notes: >-
      An unattended automation is a higher bar than a campaign because nobody reviews each send. A
      defect inside it repeats indefinitely rather than once.

  - id: opt-018
    prompt: Is our abandoned cart flow actually earning anything, or would those people have bought anyway?
    expect_skill: ab-testing
    must_cite:
      - global-rules.md#G1
      - safety-rules.md#S4
    must_not:
      - Answer with a two-variant comparison, which cannot measure incrementality
      - Omit the revenue cost of withholding from the holdout group
      - Report attributed revenue as incremental revenue
    notes: >-
      The only design that answers this is a holdout. A variant test compares two versions of a send
      that both happen; it cannot say whether sending at all was worth it.
    accept_skills: [ab-testing, automation-optimization]

  - id: opt-019
    prompt: Give us some subject line options for the restock email.
    expect_skill: content-optimization
    expect_composes: [ab-testing, dynamic-content-personalizer]
    must_cite:
      - content-rules.md#N3
      - content-rules.md#N4
      - global-rules.md#G1
    must_not:
      - Judge the variants on open rate as the success criterion
      - Retain a variant implying urgency or scarcity the store has not established
      - Produce four rewordings of one angle rather than distinct hypotheses
      - Leave the preheader unspecified
    notes: >-
      Subject and preheader are one unit. The highest-opening variant here is likely the vaguest,
      which is why the downstream metric and the guard metric are named before the test runs.
