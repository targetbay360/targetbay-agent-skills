suite: revenue
description: Revenue framing — strategy, analysis, open-ended discovery and order value.

cases:
  - id: rev-001
    prompt: Increase revenue this month.
    expect_skill: revenue-growth
    expect_composes: [revenue-analysis, audience-discovery]
    must_cite:
      - global-rules.md#G1
      - campaign-rules.md#C4
    must_not:
      - Produce a calendar before deciding what the calendar is for
      - State an expected percentage lift that is not traceable to this store's data
      - Recommend a sitewide discount without stating its margin cost
    notes: >-
      The objective is revenue with no instrument named, so the question is where growth can come from.
      Scheduling comes later, from monthly-marketing-planner.

  - id: rev-002
    prompt: We need 30% more revenue next quarter.
    expect_skill: revenue-growth
    expect_composes: [revenue-analysis]
    must_cite:
      - global-rules.md#G3
      - global-rules.md#G15
    must_not:
      - Close the gap between the target and the evidence with optimistic assumptions
      - Pad the plan with campaigns that exist only to reach the number
    notes: >-
      The correct behaviour is to plan the supportable portion and state the gap explicitly.

  - id: rev-003
    prompt: Why did revenue drop last month?
    expect_skill: revenue-analysis
    must_cite:
      - global-rules.md#G2
      - global-rules.md#G3
    must_not:
      - Propose actions before explaining the decline
      - Name a cause without testing mix shift and order-size alternatives
      - Redistribute unattributed revenue to make the attribution tidy
    notes: >-
      A "why" question about the past. revenue-growth would answer the wrong question.

  - id: rev-004
    prompt: What should we be working on?
    expect_skill: opportunity-discovery
    expect_composes: [revenue-analysis, automation-strategy, campaign-optimization]
    must_cite:
      - global-rules.md#G14
    must_not:
      - Rank findings before scanning every lens
      - Report only problems without saying what was checked and found healthy
      - Return a finding with no owning skill attached
    notes: >-
      Nobody has named the problem. Breadth before ranking is the whole discipline.

  - id: rev-005
    prompt: Raise our average order value.
    expect_skill: aov-growth
    expect_composes: [upsell, cross-sell]
    must_cite:
      - campaign-rules.md#C5
    must_not:
      - Work from the average instead of the distribution
      - Set a threshold at a round number rather than above the dense cluster
      - Push premium options at customers with no evidenced headroom
    notes: >-
      AOV as an objective, mechanism undecided. upsell would assume the tier-move mechanism.

  - id: rev-006
    prompt: Promote our premium tier to customers who might upgrade.
    expect_skill: upsell
    expect_composes: [audience-discovery]
    must_cite:
      - campaign-rules.md#C5
      - audience-rules.md#A1
    must_not:
      - Target the whole base rather than the segment with evidenced headroom
      - Omit the conversion risk of pushing value at price-sensitive customers
    notes: >-
      The mechanism is already chosen, so aov-growth would be a level too high.

  - id: rev-007
    prompt: How do we get more customers buying across categories?
    expect_skill: cross-sell
    expect_composes: [audience-discovery]
    must_cite:
      - personalization-rules.md#P5
      - audience-rules.md#A4
    must_not:
      - Build pairings from catalogue adjacency instead of observed co-purchase
      - Recommend a product to customers who already own it
    notes: >-
      Category breadth, not a higher-value version of the same thing.

  - id: rev-008
    prompt: Set up back-in-stock alerts for the people who asked.
    expect_skill: stock-and-price-alerts
    expect_composes: [audience-discovery, automation-architect]
    must_cite:
      - audience-rules.md#A1
      - personalization-rules.md#P9
    must_not:
      - Notify the whole waitlist without checking it against the units available
      - Alert at product level when the request was for a specific variant
      - Send on an availability read that was not verified at send time
      - Leave the serving order unstated
    notes: >-
      Units gate the audience. product-launch owns the broad restock announcement; this owns the
      per-contact alert to people who asked.

  - id: rev-009
    prompt: What offer should we use for the spring campaign?
    expect_skill: offer-strategy
    expect_composes: [audience-discovery]
    must_cite:
      - campaign-rules.md#C4
      - campaign-rules.md#C5
      - global-rules.md#G3
    must_not:
      - Recommend a discount without first testing whether no offer would work
      - State a depth as a round number with no derivation from this store's history
      - Assume margin data exists
      - Ignore the customers who would have converted at full price
    notes: >-
      A fashion store heading into a seasonal push. The null offer is the default and has to be
      argued away; the cost that never appears in the campaign report is margin given to people who
      were already converting.

  - id: rev-010
    prompt: Which products should we recommend in the post-purchase email?
    expect_skill: product-recommendation-strategy
    must_cite:
      - personalization-rules.md#P4
      - personalization-rules.md#P5
      - global-rules.md#G7
    must_not:
      - Recommend items from general knowledge of the vertical rather than the store's catalogue
      - Present catalogue-wide popularity as a personalised recommendation
      - Pad the block to fill the template's slots
      - Assume inventory availability that was not read
    notes: >-
      A home and furniture store. The evidence rung is named per item, and one well-evidenced
      recommendation beats six where the fourth onwards rest only on popularity.

  - id: rev-011
    prompt: What should we offer lapsed customers who haven't bought in a year?
    expect_skill: offer-strategy
    expect_composes: [audience-discovery]
    must_cite:
      - campaign-rules.md#C4
      - global-rules.md#G1
    must_not:
      - Open the sequence at the deepest discount
      - Escalate the same instrument rather than changing instrument between attempts
      - Count a single discounted transaction as a recovered customer
    notes: >-
      Recovery is measured on the second purchase. A ladder of the same discount getting deeper
      leaves nothing to escalate to and teaches the customer to wait.
    accept_skills: [offer-strategy, customer-winback]

  - id: rev-012
    prompt: Recommend products for subscribers who signed up but have never ordered.
    expect_skill: product-recommendation-strategy
    must_cite:
      - personalization-rules.md#P3
      - global-rules.md#G15
    must_not:
      - Label a segment-level selection as personalised
      - Infer affinity from data the platform does not hold for these contacts
      - Return a ranked list without saying which evidence rung it rests on
    notes: >-
      A subscription and consumables store with a cohort that has no purchase history. Reporting
      that no rung above segment level exists is the correct answer, not a failure to answer.
